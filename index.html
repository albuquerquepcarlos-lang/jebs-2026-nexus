 function csvCell(v){const s=String(v??"");return '"'+s.replace(/"/g,'""')+'"'}
function buildReportCSV(){
 const rows=[['Transporte','Data','Categoria','Representante','Passageiros','Status','Paradas confirmadas','Total de paradas','Chegada']];
 for(const t of state.transports){
   const h=hist(t), stops=(t.stops||[]).filter(x=>x.kind!=="chegada"), arrival=(t.stops||[]).find(x=>x.kind==="chegada");
   rows.push([t.number,t.date,t.category,t.representative,t.passengers,statusText(t),h.stops?.length||0,stops.length,arrival?.time||'']);
 }
 return '\\uFEFF'+rows.map(r=>r.map(csvCell).join(';')).join('\\r\\n');
}

// Minimal XLSX reader: works without external libraries. It reads the ZIP/XML structure used by .xlsx.
function u16(d,o){return d.getUint16(o,true)}
function u32(d,o){return d.getUint32(o,true)}
function findEOCD(bytes){
 const sig=[0x50,0x4b,0x05,0x06], start=Math.max(0,bytes.length-66000);
 for(let i=bytes.length-22;i>=start;i--)if(bytes[i]===sig[0]&&bytes[i+1]===sig[1]&&bytes[i+2]===sig[2]&&bytes[i+3]===sig[3])return i;
 throw new Error("Arquivo XLSX inválido: ZIP central não encontrado.");
}
async function unzipXlsx(buf){
 const bytes=new Uint8Array(buf),d=new DataView(buf),e=findEOCD(bytes);
 const n=u16(d,e+10),cdSize=u32(d,e+12),cdOff=u32(d,e+16),entries={};
 let p=cdOff;
 for(let k=0;k<n;k++){
   if(u32(d,p)!==0x02014b50)throw new Error("Estrutura ZIP inválida.");
   const method=u16(d,p+10),cs=u32(d,p+20),us=u32(d,p+24),nl=u16(d,p+28),el=u16(d,p+30),cl=u16(d,p+32),lo=u32(d,p+42);
   const name=new TextDecoder().decode(bytes.slice(p+46,p+46+nl));entries[name]={method,cs,us,lo};p+=46+nl+el+cl;
 }
 const cache={};
 async function read(name){
   if(cache[name])return cache[name];
   const x=entries[name];if(!x)throw new Error("Arquivo interno ausente: "+name);
   const lp=x.lo, nl=u16(d,lp+26),el=u16(d,lp+28),start=lp+30+nl+el,raw=bytes.slice(start,start+x.cs);
   let out;
   if(x.method===0)out=raw.buffer.slice(raw.byteOffset,raw.byteOffset+raw.byteLength);
   else if(x.method===8){
     const ds=new DecompressionStream("deflate-raw");
     out=await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer();
   } else throw new Error("Método de compressão XLSX não suportado.");
   cache[name]=out;return out;
 }
 return {entries,read};
}
function xmlText(el){return el?el.textContent||"":""}
function colIndex(ref){let m=String(ref).match(/^([A-Z]+)/);if(!m)return 0;let n=0;for(const ch of m[1])n=n*26+ch.charCodeAt(0)-64;return n-1}
async function xlsxToRows(buf){
 const z=await unzipXlsx(buf),dec=new TextDecoder();
 const wb=new DOMParser().parseFromString(dec.decode(await z.read("xl/workbook.xml")),"application/xml");
 const rels=new DOMParser().parseFromString(dec.decode(await z.read("xl/_rels/workbook.xml.rels")),"application/xml");
 const relMap={};rels.querySelectorAll("Relationship").forEach(r=>relMap[r.getAttribute("Id")]=r.getAttribute("Target"));
 const shared=[];
 if(z.entries["xl/sharedStrings.xml"]){
   const ss=new DOMParser().parseFromString(dec.decode(await z.read("xl/sharedStrings.xml")),"application/xml");
   ss.querySelectorAll("si").forEach(si=>shared.push(Array.from(si.querySelectorAll("t")).map(t=>xmlText(t)).join("")));
 }
 const sheets=[];
 for(const s of wb.querySelectorAll("sheets > sheet")){
   const rid=s.getAttribute("r:id")||s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
   let target=relMap[rid]||"";
   if(target.startsWith("/"))target=target.slice(1);else if(!target.startsWith("xl/"))target="xl/"+target.replace(/^\.?\//,"");
   const doc=new DOMParser().parseFromString(dec.decode(await z.read(target)),"application/xml");
   const rows=[];
   doc.querySelectorAll("sheetData > row").forEach(r=>{
     const arr=[];r.querySelectorAll(":scope > c").forEach(c=>{
       const ref=c.getAttribute("r")||"",idx=colIndex(ref);let val="";
       const typ=c.getAttribute("t"),v=c.querySelector("v");
       if(typ==="s"&&v)val=shared[Number(v.textContent)]??"";
       else if(typ==="inlineStr")val=xmlText(c.querySelector("is"));
       else if(typ==="b"&&v)val=v.textContent==="1";
       else if(v)val=v.textContent;
       while(arr.length<=idx)arr.push("");arr[idx]=val;
     });
     rows.push(arr);
   });
   sheets.push({name:s.getAttribute("name")||"",rows});
 }
 return sheets;
}
function excelTimeToString(v){
 const raw=String(v??"").trim();
 if(!raw)return "";
 const normalized=raw.replace(",",".");
 const n=Number(normalized);
 if(Number.isFinite(n) && n>=0 && n<1){
   const total=Math.round(n*24*60*60)%86400;
   const hh=Math.floor(total/3600),mm=Math.floor((total%3600)/60),ss=total%60;
   return `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
 }
 if(/^\d{1,2}:\d{1,2}(:\d{1,2})?$/.test(raw)){
   const [h,m,sec="0"]=raw.split(":");
   return `${String(Number(h)).padStart(2,"0")}:${String(Number(m)).padStart(2,"0")}:${String(Number(sec)).padStart(2,"0")}`;
 }
 return raw;
}
function parseTransportRows(sheets){
 const out=[];
 for(const sh of sheets){
   const ret=/\bRET\b/i.test(sh.name), sheetDate=(sh.name.match(/(\d{1,2})[.,]9/)||[])[1];
   let current=null;
   const finish=()=>{if(current){current.passengers=current.stops.reduce((a,x)=>a+(Number(x.qty)||0),0);out.push(current);current=null}};
   for(let i=0;i<sh.rows.length;i++){
     const row=(sh.rows[i]||[]).map(v=>String(v??"").trim()), joined=row.join(" ");
     const tm=joined.match(/TRANSPORTE\s*([0-9]+)?\s*[-–—]?\s*DATA\s*:?\s*(\d{1,2})?\s*[\/.]?\s*(\d{1,2})?/i);
     if(tm){
       finish();
       const num=tm[1]?Number(tm[1]):null, dd=ret?sheetDate:(tm[2]||sheetDate), mm=ret?"09":(tm[3]||"09");
       current={id:`${ret?"retorno":"embarque"}|${normKeyPart(sh.name)}|ROW|${i+1}`,sourceKey:`${ret?"retorno":"embarque"}|${normKeyPart(sh.name)}|ROW|${i+1}`,sheet:sh.name,number:num??"—",row:i+1,date:dd?String(dd).padStart(2,"0")+"/"+String(mm).padStart(2,"0"):"Data não informada",category:ret?"retorno":"embarque",contact:"",representative:"",distance:"",passengers:0,stops:[]};
       const head=sh.rows[i+1]||[];
       const h8=String(head[7]??"").trim();
       if(h8 && isNaN(Number(h8)) && !/^(TAMANHO|UNIFORMES?)$/i.test(h8))current.contact=h8;
       if(h8 && Number.isFinite(Number(h8)))current.distance=String(Number(h8))+" km";
       continue;
     }
     if(!current)continue;
     if(/^RELAÇÃO DE TRANSPORTADOS/i.test(joined)){finish();continue}
     const rep=row.find(v=>/^REPRESENTANTE(?:\s+.+)?$/i.test(v));
     if(rep){
       const m=rep.match(/^REPRESENTANTE\s+(.+)$/i);if(m)current.representative=m[1].trim();
       continue;
     }
     if(/^CHEGADA$/i.test(row[0]||"")){
       current.stops.push({kind:"chegada",municipio:"CHEGADA",time:excelTimeToString(row[1]||""),destination:row[3]||row[6]||"",qty:Number(row[5])||0});
       continue;
     }
     // Stop row: municipality, school/address/contact/qty/destination.
     const hasStop=row.slice(0,7).some(v=>String(v).trim()!=="");
     const qty=Number(row[5]);
     if(hasStop && (row[0]||row[6]||row[2]) && !Number.isNaN(qty)){
       const municipio=String(row[0]||row[6]||"").trim();
       current.stops.push({kind:"embarque",municipio:municipio||String(row[6]||"").trim(),time:excelTimeToString(row[1]||""),school:row[2]||"",address:row[3]||"",contact:row[4]||"",qty:qty||0,destination:row[6]||""});
     }
   }
   finish();
 }
 return out;
}
async function importWorkbook(file){
 try{
   const buf=await file.arrayBuffer();
   let imported=[];
   if(/\.csv$/i.test(file.name)){
     const text=new TextDecoder("utf-8").decode(buf),lines=text.split(/\r?\n/),rows=lines.map(x=>x.split(";"));
     imported=parseTransportRows([{name:"IMPORTADO",rows}]);
   }else{
     const sheets=await xlsxToRows(buf);
     imported=parseTransportRows(sheets);
   }
   if(!imported.length)throw new Error("Não encontrei nenhum bloco 'TRANSPORTE' nessa planilha.");
   imported=imported.map(t=>({...t,stops:Array.isArray(t.stops)?t.stops.map(x=>x?.kind==="chegada"?({...x,time:formatExcelTime(x.time)}):x):t.stops}));
   const old=state.transports.slice();
   const oldByKey=new Map(old.map(t=>[stableKey(t),t]));
   const oldByIdentity=new Map(old.map(t=>[`${t.category||"embarque"}|${t.number??""}|${t.date||""}`,t]));
   const next=[];
   for(const t of imported){
     const key=stableKey(t); const identity=`${t.category||"embarque"}|${t.number??""}|${t.date||""}`;
     const prev=oldByKey.get(key)||oldByIdentity.get(identity);
     t.id=key;
     if(prev){
       const ph=state.history[prev.id]||state.history[stableKey(prev)];
       if(ph) state.history[key]=ph;
     }
     next.push(t);
   }
   // The spreadsheet is authoritative: importing the same file twice does not append anything.
   state.transports=next;
   migrateHistory();
   localRevision++;
   localStorage.setItem("jebsNexusHistory",JSON.stringify(state.history));
   state.view="categories";state.date=null;state.filter="all";render();
   const ok=await serverSync({replaceTransports:true});
   if(!ok)throw new Error("Não foi possível gravar a planilha no servidor.");
   alert(`Planilha importada com sucesso: ${state.transports.length} transporte(s). O histórico de check-ins foi preservado.`);
 }catch(err){console.error(err);alert("Erro ao importar a planilha: "+(err?.message||err));}
}

function updateSearchClear(){const b=$("clearSearch"),s=$("search");if(b&&s)b.classList.toggle("show",!!s.value)}
$("search").addEventListener("input",()=>{updateSearchClear();render()});
$("clearSearch").addEventListener("click",()=>{ $("search").value=""; updateSearchClear(); render(); $("search").focus(); });
$("file").addEventListener("change",e=>{const f=e.target.files[0];if(f)importWorkbook(f);e.target.value=""});
$("homeTop").onclick=()=>{state.view="home";state.programBlock=null;state.convModal=null;state.convBlock=null;state.reportFilter=null;render();window.scrollTo({top:0,behavior:"smooth"})};
updateSearchClear();
render();
hydrateFromServer();
</script></body></html>
